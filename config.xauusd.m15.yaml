# MT5 连接配置
mt5:
  login: 5050445394
  password: "UuVy*b7g"
  server: "MetaQuotes-Demo"
  path: ""
  timeout: 60000
  portable: false

# 交易运行配置
trading:
  symbol: "XAUUSD"
  timeframe: "M15"
  history_bars: 2000
  mt5_bar_time_shift_hours: 3
  slippage_points: 30
  magic_number: 260516
  comment: "xau-m15-wave"
  poll_interval_seconds: 15
  max_open_positions: 1

# 策略参数配置
strategy:
  name: "xau_m15_wave"
  risk_per_trade: 0.003
  # 三层 EMA
  ema_fast: 12
  ema_mid: 30
  ema_slow: 70
  rsi_period: 14
  atr_period: 20
  atr_stop_multiple: 2.4
  reward_to_risk: 2.5
  atr_min_threshold: 15.0
  us_session_blackout: true
  # 以下给通用策略保留
  short_window: 20
  long_window: 50
  rsi_buy_threshold: 55.0
  rsi_sell_threshold: 45.0
  breakout_lookback: 20
  take_profit_pct: 0.003
  stop_loss_pct: 0.004
  volume_window: 20
  volume_multiplier: 1.05
  breakout_buffer_pct: 0.0002
  adx_period: 14
  adx_threshold: 22.0
  leverage_multiplier: 1.0
  # ATR 移动止损倍数（自适应波动率，跟随价格回撤的 ATR 倍数）
  atr_trailing_multiple: 2.5

# 回测参数配置
backtest:
  initial_balance: 110000
  commission_per_lot: 0.0
  spread_points: 20
  contract_size: 1.0

# 安全与风控配置
safety:
  timezone: "Asia/Shanghai"
  trading_windows:
    - "00:00-24:00"
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 6
  one_direction_per_day: false
  news_blackout_windows: []
  trailing_stop_enabled: true
  trailing_trigger_pct: 0.0015
  trailing_distance_pct: 0.0012

# 自动财经日历配置
news_calendar:
  enabled: true
  provider: "mt5_file"
  api_key: "guest:guest"
  countries:
    - "united states"
  importance: 3
  pre_blackout_minutes: 15
  post_blackout_minutes: 15
  lookahead_days: 7
  cache_minutes: 30
  request_timeout_seconds: 20
  common_filename: "mt5_calendar_events.csv"
  file_path: ""

# 回测报表输出配置
reporting:
  output_dir: "reports/xauusd_m15"
  save_summary_json: true
  save_trades_csv: true
  save_equity_csv: true
